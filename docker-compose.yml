version: '3.9'
services:
  kg:
    build:
      context: .
      dockerfile: ./Dockerfile.next
    platform: linux/amd64
    image: ofeeney16/kea-kg:2.5.15
    x-kubernetes:
      strategy:
        type: Recreate
      imagePullPolicy: IfNotPresent
      annotations:
        maayanlab.cloud/ingress: http://localhost:3000
    ports:
      - 3000:3000
    environment:
      - NEO4J_URL=bolt://neo4j-v5:7687
      - NEXT_PUBLIC_ENRICHR_URL=https://maayanlab.cloud/Enrichr
      - NEXT_PUBLIC_GENESHOT_URL=https://maayanlab.cloud/geneshot
      - NEO4J_USER
      - NEO4J_NAME
      - NEO4J_PASSWORD
      - NEXT_PUBLIC_PREFIX
      - NEXT_PUBLIC_GA_MEASUREMENT_ID
      - NEXT_PUBLIC_HOST
      - NEXT_PUBLIC_SCHEMA
      - TURL
      - TURL_URL
      - NEXT_PUBLIC_HOMEPAGE
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 1G

  neo4j-v5:
    image: neo4j:5.19
    x-kubernetes:
      imagePullPolicy: IfNotPresent
    environment:
      - NEO4J_PLUGINS= ["apoc", "n10s"]
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_dbms_memory_heap_max__size=3G
      - NEO4J_dbms_memory_heap_initial__size=2G
      - NEO4J_server_config_strict__validation_enabled=false
    ports:
      - 7687:7687
      - 7474:7474
    volumes:
      - kea-kg-neo4j-v5:/data

volumes:
  kea-kg-neo4j-v5:
    x-kubernetes:
      size: 25Gi
      class: gp2

x-kubernetes:
  name: kea-kg
  namespace: kea-kg
